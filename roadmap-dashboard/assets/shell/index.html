<title>ttPy Roadmap</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--ink:#12161c;--paper:#f4f6f8;--slate:#5c6672;--teal:#1f8f8a;--gold:#b8862f;--coral:#c8563f;--green:#3f8f5f;--blue:#3b6fa0;
--bg:var(--paper);--surface:#fff;--surface-2:#e8ecef;--border:rgba(18,22,28,.13);--text:#1b2027;--text-secondary:#5c6672;
--accent:var(--teal);--accent-2:var(--gold);--status-done:var(--green);--status-progress:var(--blue);--status-review:var(--gold);
--status-planning:#6f5aa8;--status-plan-review:#a34b8f;--status-approval:#186b7d;--status-blocked:var(--coral);--status-queued:var(--slate);
color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:var(--ink);--surface:#181d24;--surface-2:#20262e;
--border:rgba(255,255,255,.14);--text:#e7eaee;--text-secondary:#98a2ae;--accent:#2bb0aa;--accent-2:#d1a24a;--status-done:#59b37a;
--status-progress:#6fa0d1;--status-review:#d1a24a;--status-planning:#9d8ad9;--status-plan-review:#d18cc3;--status-approval:#5fb5cc;
--status-blocked:#e07a5f;--status-queued:#8891a0}}
:root[data-theme="dark"]{--bg:var(--ink);--surface:#181d24;--surface-2:#20262e;--border:rgba(255,255,255,.14);--text:#e7eaee;
--text-secondary:#98a2ae;--accent:#2bb0aa;--accent-2:#d1a24a;--status-done:#59b37a;--status-progress:#6fa0d1;--status-review:#d1a24a;
--status-planning:#9d8ad9;--status-plan-review:#d18cc3;--status-approval:#5fb5cc;--status-blocked:#e07a5f;--status-queued:#8891a0}
body{background:var(--bg);color:var(--text)}
</style>
<link rel="stylesheet" href="styles.css">
<div id="app"></div>
<script src="app.js"></script>
